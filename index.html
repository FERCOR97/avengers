<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Keeps this page out of Google and Bing. Anyone you send the link to can
     still open it — it just won't turn up when someone searches your name.
     Leave it in unless you actually want strangers finding this. -->
<meta name="robots" content="noindex">

<title>Which Avenger are you?</title>


<style>
  /* ===================================================================
     STYLES. This is CSS. It controls how things look.
     Change any colour below and reload the page to see what happens.
     =================================================================== */

  :root {
    --bg: #9115be;
    --card: #403965;
    --text: #f2f0ff;
    --muted: #a39fc0;
    --accent: #b5651d;      /* TODO: make this your colour */
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }

  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  /* The thin bar that fills up as you answer */
  .progress {
    height: 10px;
    background: rgba(85, 173, 8, 0.1);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .3s ease;
  }

  .question { font-size: 1.25rem; font-weight: 600; margin: 0 0 20px; }

  /* Optional pictures. Hidden unless a question or result has one.
     object-fit: cover means the image fills the box and crops rather than
     squashing, so photos of different shapes all look tidy. */
  .picture {
    display: block;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 18px;
  }

  /* Answer buttons */
  .answers { display: grid; gap: 12px; }
  button.answer {
    font: inherit;
    text-align: left;
    color: var(--text);
    background: rgba(255,255,255,.06);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .05s;
  }
  button.answer:hover { background: rgba(255,255,255,.12); }
  button.answer:focus-visible { outline: none; border-color: var(--accent); }
  button.answer:active { transform: scale(.99); }

  /* The result screen */
  .result-emoji { font-size: 4rem; line-height: 1; margin-bottom: 8px; }
  .result-title { font-size: 2rem; margin: 0 0 12px; color: var(--accent); }
  .result-blurb { color: var(--muted); margin: 0 0 24px; }

  /* The little scoreboard under the buttons. Small and dim on purpose —
     it's there so you can see the scoring working, not to be the star. */
  .scoreboard {
    margin: 20px 0 0;
    font-size: .75rem;
    color: var(--muted);
    opacity: .75;
    line-height: 1.6;
  }

  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  button.action {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
  }
  button.action.ghost {
    background: transparent;
    color: var(--text);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.2);
  }

  .hidden { display: none; }
</style>
</head>

<body>

<!-- ===================================================================
     THE PAGE. This is HTML. It's the boxes that hold everything.
     JavaScript below fills these in — you rarely need to edit this part.
     =================================================================== -->

<main class="card">

  <!-- Screen 1: the quiz -->
  <section id="quiz-screen">
    <h1 id="quiz-title">Which Avenger are you?</h1>
    <p class="sub" id="quiz-subtitle">Fifteen questions. Go with your first instinct.</p>

    <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>

    <img class="picture hidden" id="question-image" alt="">
    <p class="question" id="question-text">Question goes here</p>
    <div class="answers" id="answers"></div>
  </section>

  <!-- Screen 2: the result. Hidden until the quiz is finished. -->
  <section id="result-screen" class="hidden">
    <img class="picture hidden" id="result-image" alt="">
    <div class="result-emoji" id="result-emoji">✨</div>
    <h1 class="result-title" id="result-title">Result</h1>
    <p class="result-blurb" id="result-blurb"></p>
    <div class="row">
      <button class="action" id="copy-button">Copy my result</button>
      <button class="action ghost" id="restart-button">Try again</button>
    </div>

    <!-- Filled in by showScoreboard(). Delete this line when you don't
         want people seeing the numbers behind their result. -->
   <p class="scoreboard" id="scoreboard"></p> 
  </section>

</main>

<script>
/* =====================================================================
   1. YOUR CONTENT
   =====================================================================
   Everything about what this quiz IS lives in the two lists below.
   You can change all of it without touching any of the code further down.

   HOW SCORING WORKS
   Every answer awards points to one or more results, using the result's
   `id`. At the end, whichever id has the most points wins.
   ===================================================================== */

const QUIZ_TITLE    = "Which Avenger are you?";
const QUIZ_SUBTITLE = "Fifteen questions. Go with your first instinct.";

const QUESTIONS = [

    ],

    // image: "images/group-project.jpg",

      { text: "somewhere with history and meaning", points: { capt: 2 } },
      { text: "somewhere loud and new",             points: { thor: 2, iron: 1 } },

    // image: "images/group-project.jpg",
    answers: [

      { text: "I can do this all day",       points: { capt: 2 } },
      { text: "bring it",                    points: { thor: 2, hulk: 1 } },
      { text: "I've got red in my ledger",   points: { bw: 2 } },

    ],
  },
  {

    // image: "images/group-project.jpg",
    answers: [
      { text: "Big vision, delegate details", points: { iron: 2 } },
      { text: "Lead by example",              points: { capt: 2, bw: 1 } },
      { text: "Lead by energy/morale",        points: { thor: 2, iron: 1 } },
      { text: "Lead from the shadows",        points: { bw: 2 } },

    ],
  },
  {
    q: "Pick a flaw",
    // image: "images/group-project.jpg",
    answers: [
      { text: "Ego",          points: { iron: 2, thor: 1 } },
      { text: "Stubbornness", points: { capt: 2 } },
      { text: "Recklessness", points: { thor: 2, hulk: 1 } },
      { text: "secretive",    points: { bw: 2 } },
      { text: "Temper",       points: { hulk: 2 } },
    ],
  },
  {
    q: "Your biggest strength",
    // image: "images/group-project.jpg",
    answers: [
      { text: "Confidence",   points: { iron: 2, thor: 1 } },
      { text: "Loyalty",      points: { capt: 2 } },
      { text: "Passion",      points: { thor: 2, capt: 1 } },
      { text: "Strategy",     points: { bw: 2, iron: 1 } },
      { text: "Raw strength", points: { hulk: 2 } },
    ],
  },
  {
    q: "How do you react to being told no",
    // image: "images/group-project.jpg",
    answers: [
      { text: "Find a workaround nobody thought of",  points: { iron: 2, bw: 1 } },
      { text: "Ask why, then push back on principle", points: { capt: 2 } },
      { text: "Ignore it and do it anyway",           points: { thor: 2, iron: 1 } },
      { text: "Say nothing, find another route",      points: { bw: 2 } },
      { text: "Walk away before I say something",     points: { hulk: 2, bw: 1 } },
    ],
  },
  {
    q: "Your role in the group chat",
    // image: "images/group-project.jpg",
    answers: [
      { text: "The one with the plan and the jokes",      points: { iron: 2 } },
      { text: "The one who checks everyone's okay",       points: { capt: 2 } },
      { text: "The one suggesting something wild at 1am", points: { thor: 2, iron: 1 } },
      { text: "Reads everything, replies to nothing",     points: { bw: 2, hulk: 1 } },
      { text: "Muted. Shows up when it's serious",        points: { hulk: 2, capt: 1 } },
    ],
  },
  {
    q: "Saturday morning, no plans",
    // image: "images/group-project.jpg",
    answers: [
      { text: "Already building something",    points: { iron: 2 } },
      { text: "Up early, out running",         points: { capt: 2, thor: 1 } },
      { text: "Whoever calls first, I'm in",   points: { thor: 2 } },
      { text: "Somewhere quiet with a coffee", points: { bw: 2, hulk: 1 } },
      { text: "Still asleep. Don't",           points: { hulk: 2 } },
    ],
  },
  {
    q: "What do people notice about you first",
    // image: "images/group-project.jpg",
    answers: [
      { text: "The confidence",           points: { iron: 2, thor: 1 } },
      { text: "The steadiness",           points: { capt: 2 } },
      { text: "The volume",               points: { thor: 2 } },
      { text: "How little you give away", points: { bw: 2 } },
      { text: "How calm you seem",        points: { hulk: 2, bw: 1 } },
    ],
  },
  {
    q: "How do you make big decisions",
    // image: "images/group-project.jpg",
    answers: [
      { text: "Run the numbers, trust my gut anyway", points: { iron: 2 } },
      { text: "Ask what the right thing to do is",    points: { capt: 2 } },
      { text: "Whatever feels alive",                 points: { thor: 2, hulk: 1 } },
      { text: "Weigh every angle, in private",        points: { bw: 2, iron: 1 } },
      { text: "Delay until I have to choose",         points: { hulk: 2 } },
    ],
  },
  {
    q: "Rules are",
    // image: "images/group-project.jpg",
    answers: [
      { text: "For people without better ideas", points: { iron: 2, thor: 1 } },
      { text: "There for a reason, usually",     points: { capt: 2 } },
      { text: "Slow",                            points: { thor: 2 } },
      { text: "Useful cover",                    points: { bw: 2, iron: 1 } },
      { text: "Fine, until they corner me",      points: { hulk: 2 } },
    ],
  },
  {
    q: "What actually drives you",
    // image: "images/group-project.jpg",
    answers: [
      { text: "Proving I can",           points: { iron: 2, thor: 1 } },
      { text: "Doing right by people",   points: { capt: 2 } },
      { text: "The thrill of it",        points: { thor: 2 } },
      { text: "Making up for something", points: { bw: 2, capt: 1 } },
      { text: "Being left in peace",     points: { hulk: 2, bw: 1 } },
    ],
  },
  {
    q: "Under real pressure you",
    // image: "images/group-project.jpg",
    answers: [
      { text: "Talk faster, think faster",     points: { iron: 2 } },
      { text: "Get very still and very clear", points: { capt: 2, bw: 1 } },
      { text: "Get louder",                    points: { thor: 2 } },
      { text: "Go completely quiet",           points: { bw: 2, hulk: 1 } },
      { text: "Feel it building",              points: { hulk: 2 } },
    ],
  },
  {
    q: "How do you celebrate a win",
    // image: "images/group-project.jpg",
    answers: [
      { text: "Big. Everyone hears about it", points: { iron: 2, thor: 1 } },
      { text: "Thank the team, move on",      points: { capt: 2, bw: 1 } },
      { text: "Party. Immediately",           points: { thor: 2, iron: 1 } },
      { text: "Privately. Maybe not at all",  points: { bw: 2, hulk: 1 } },
      { text: "Relief more than joy",         points: { hulk: 2, capt: 1 } },
    ],
  },
    // 15 questions. To add more, copy the shape above exactly.
    // The main pick gets 2 points; a second hero gets 1 where it fits.
    // Watch the commas - every } needs a , after it except the last one.
];

const RESULTS = [
  {
    id: "iron",       // must match the ids used in points
    title: "Iron Man",
    emoji: "🤖",
    blurb: "You're the genius who turns chaos into a plan",
    // image: "images/result-chaos.jpg",   // optional — this is the one people share
  },
  {
    id: "capt",
    title: "Captain America",
    emoji: "🛡️",
    blurb: "You are the one everyone counts on to do the right thing, even when it's hard",
    // image: "images/result-calm.jpg",
  },
 {
    id: "thor",
    title: "Thor",
    emoji: "⚡",
    blurb: "You bring the energy into every room, impossible to ignore",
    // image: "images/result-calm.jpg",
  },
  {
    id: "bw",
    title: "Black Widow",
    emoji: "🕷️",
    blurb: "You're a quiet strategist",
    // image: "images/result-calm.jpg",
  },
  {
    id: "hulk",
    title: "Hulk",
    emoji: "💚",
    blurb: "Calm until it matters — then unstoppable",
    // image: "images/result-calm.jpg",
  },
  // TODO: add a third and fourth result. Two is a bit boring.
];


/* =====================================================================
   2. THE ENGINE
   =====================================================================
   You do not need to understand all of this on day one. You WILL need to
   understand it by Friday, because you have to explain it.

   Ask Claude: "explain this file line by line, simply".
   ===================================================================== */

// Where we are in the quiz, and the running score.
let currentQuestion = 0;
let scores = {};

// The questions in the order THIS run will show them. It starts empty and gets
// filled with a shuffled copy when the quiz begins. QUESTIONS itself is never
// reordered, so your file stays readable in the order you wrote it.
let questionOrder = [];

// Grab the bits of the page we need to change. document.getElementById
// finds an element by the id="..." we gave it in the HTML above.
const questionText   = document.getElementById("question-text");
const questionImage  = document.getElementById("question-image");
const answersBox     = document.getElementById("answers");
const progressFill   = document.getElementById("progress-fill");
const quizScreen     = document.getElementById("quiz-screen");
const resultScreen   = document.getElementById("result-screen");


// Put the title and teaser on the page from your variables above.
document.getElementById("quiz-title").textContent = QUIZ_TITLE;
document.getElementById("quiz-subtitle").textContent = QUIZ_SUBTITLE;
document.title = QUIZ_TITLE;


/**
 * Return a shuffled COPY of any list, leaving the original untouched.
 * Used twice: once for the question order, once for each question's answers.
 */
function shuffle(list) {
  // .slice() with no arguments makes a copy. This matters: `const` stops you
  // REASSIGNING QUESTIONS, but it does NOT stop you reordering what's inside
  // it. Without this copy we'd be scrambling your content permanently.
  const copy = list.slice();

  // Walk backwards from the last position down to position 1. Position 0 needs
  // no turn: by the time we reach it, it's the only one left.
  for (let i = copy.length - 1; i > 0; i--) {

    // Math.random() gives a decimal from 0 up to (but never reaching) 1.
    // Times (i + 1) stretches that range, Math.floor chops the decimals off,
    // so j lands on a whole number somewhere between 0 and i.
    const j = Math.floor(Math.random() * (i + 1));

    // Swap positions i and j. It takes three steps because assigning one
    // straight onto the other would destroy the value we still need.
    // temp is a parking space that holds it for one line.
    const temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }

  // Hand back the scrambled copy. The original list is exactly as it was.
  return copy;
}


/**
 * Draw one question on the screen: the text, and a button per answer.
 */
function showQuestion() {
  // Read from the shuffled running order, NOT from QUESTIONS directly.
  // currentQuestion is still 0, 1, 2... it's the LIST that changed order.
  const question = questionOrder[currentQuestion];

  questionText.textContent = question.q;

  // Show a picture if this question has one, hide the box if it doesn't.
  showPicture(questionImage, question.image);

  // Empty the answers box, then add one button for each answer.
  answersBox.innerHTML = "";

  // Shuffle a copy of THIS question's five answers, so the hero order on the
  // buttons changes every time too. Without this the third button is always
  // Thor's, and anyone who plays twice can game the result by position.
  const shuffledAnswers = shuffle(question.answers);

  for (let i = 0; i < shuffledAnswers.length; i++) {
    const answer = shuffledAnswers[i];

    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer.text;

    // The button remembers the answer OBJECT, not its position — so shuffling
    // the display order can never mis-assign the points.
    button.addEventListener("click", function () {
      chooseAnswer(answer);
    });

    answersBox.appendChild(button);
  }

  // Update the progress bar. Maths: question 0 of 15 = 0%, 3 of 15 = 20%.
  // Ask the running order how long it is, rather than assuming 15.
  const percent = (currentQuestion / questionOrder.length) * 100;
  progressFill.style.width = percent + "%";
}


/**
 * Show a picture, or hide the box if there isn't one.
 *
 * `path` is whatever you put in `image:` — e.g. "images/friday-night.jpg".
 * If you've left that line commented out, `path` is undefined and we just
 * hide the box, which is why the quiz works fine with no pictures at all.
 */
function showPicture(element, path) {
  if (path) {
    element.src = path;
    element.classList.remove("hidden");
  } else {
    element.classList.add("hidden");
  }
}


/**
 * Runs when someone clicks an answer.
 */
function chooseAnswer(answer) {
  addPoints(answer.points);

  currentQuestion = currentQuestion + 1;

  // questionOrder.length is the same 15 as QUESTIONS.length, but asking the
  // running order keeps this correct if you ever show only some questions.
  if (currentQuestion < questionOrder.length) {
    showQuestion();          // more questions left
  } else {
    showResult();            // that was the last one
  }
}


/* ---------------------------------------------------------------------
   WEDNESDAY'S JOB. This is the only part deliberately left unfinished.
   --------------------------------------------------------------------- */

/**
 * Add an answer's points onto the running `scores` object.
 *
 * `answer.points` looks like:   { chaos: 2, calm: 1 }
 * `scores` should end up like:  { chaos: 7, calm: 3 }
 *
 * HINT ------------------------------------------------------------------
 * You need to loop over the keys of the points object. This gives you
 * each id in turn:
 *
 *     for (const id in points) {  ...  }
 *
 * Inside the loop, add points[id] onto scores[id]. Careful: the first
 * time you see an id, scores[id] doesn't exist yet — it's `undefined`,
 * and undefined + 2 is NaN, not 2. So start it at 0 if it's missing.
 * ---------------------------------------------------------------------- */
function addPoints(points) {
  for (const id in points) {
    if (scores[id]===undefined) {
      scores[id] = 0;
    }
    scores[id] += points[id];
  }
}


/**
 * Work out which result won, and show it.
 */
function showResult() {
  progressFill.style.width = "100%";

  const winningId = highestScoringId();

  // Find the result whose id matches, or fall back to the first one.
  let winner = RESULTS[0];
  for (let i = 0; i < RESULTS.length; i++) {
    if (RESULTS[i].id === winningId) {
      winner = RESULTS[i];
    }
  }

  showPicture(document.getElementById("result-image"), winner.image);
  document.getElementById("result-emoji").textContent = winner.emoji;
  document.getElementById("result-title").textContent = winner.title;
  document.getElementById("result-blurb").textContent = winner.blurb;

  showScoreboard(winningId); 

  // Swap the screens over.
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");
}


/**
 * Look up a result's title from its id. "thor" gives back "Thor".
 * Falls back to the id itself if nothing matches, so it never comes back empty.
 */
function titleFor(id) {
  for (let i = 0; i < RESULTS.length; i++) {
    if (RESULTS[i].id === id) {
      return RESULTS[i].title;
    }
  }
  return id;
}


/**
 * Print the final scores in small text under the buttons, highest first.
 * Purely so you can see the scoring working — the quiz runs fine without it.
 */
function showScoreboard(winningId) {
  const scoreboard = document.getElementById("scoreboard");

  // No points at all means something went wrong. Say nothing rather than
  // printing "bestScore: undefined".
  if (!winningId) {
    scoreboard.textContent = "";
    return;
  }

  // Object.keys turns { iron: 8, thor: 14 } into the list ["iron", "thor"],
  // which we can sort. Objects can't be sorted; arrays can.
  const ids = Object.keys(scores);

  // Highest score first, so the winner always leads the line.
  ids.sort(function (a, b) {
    return scores[b] - scores[a];
  });

  let line = "bestScore: " + scores[winningId] + "  |  ";

  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    line = line + titleFor(id) + " " + scores[id];
    if (i < ids.length - 1) {
      line = line + "  ·  ";
    }
  }

  scoreboard.textContent = line;
}


/**
 * Return the id with the most points.
 * Works once addPoints is filled in. Until then scores is empty and this
 * returns null, which is why everyone gets the same result today.
 */
function highestScoringId() {
  let bestId = null;
  let bestScore = -1;

  for (const id in scores) {
    if (scores[id] > bestScore) {
      bestScore = scores[id];
      bestId = id;
    }
  }

  return bestId;
}


// ---- The buttons on the result screen -------------------------------

document.getElementById("restart-button").addEventListener("click", function () {
  currentQuestion = 0;
  scores = {};
  questionOrder = shuffle(QUESTIONS);   // a brand new order for every replay
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  showQuestion();
});

document.getElementById("copy-button").addEventListener("click", function () {
  const title = document.getElementById("result-title").textContent;
  const emoji = document.getElementById("result-emoji").textContent;
  const message = "I got " + title + " " + emoji + " — " + QUIZ_TITLE;

  navigator.clipboard.writeText(message);

  // Confirm it worked, then put the label back after a moment.
  const button = document.getElementById("copy-button");
  button.textContent = "Copied!";
  setTimeout(function () { button.textContent = "Copy my result"; }, 1500);
});


// Start the quiz. The shuffle MUST come first: showQuestion reads from
// questionOrder, which is still an empty list until this line runs.
questionOrder = shuffle(QUESTIONS);
showQuestion();
</script>

</body>
</html>
